meta:
  profile: academic-paper
  figureType: architecture
  theme: academic-color
  palette: c4-blue
  layout: horizontal
  font:
    primary: Helvetica, Arial, sans-serif
    cjk: Helvetica, Arial, sans-serif
    formula: Helvetica, Arial, sans-serif
  title: Wayfarer system architecture
  description: Three tiers (capture, processing, viewing) with the real components and the interfaces between them.
  legend: >-
    Dark blue: phone and browser side. Light blue: processing on the PC. Grey: data artifacts. Ellipses are people;
    dashed arrows carry data.
nodes:
  - id: lane_cap
    label: Capture (phone)
    type: process
    bounds:
      x: 20
      'y': 20
      width: 230
      height: 450
    style:
      fillColor: '#F7F9FC'
      strokeColor: '#B8C2CC'
      fontSize: 15
      fontColor: '#1A1A1A'
      bold: true
      align: left
      verticalAlign: top
      spacingLeft: 10
      spacingTop: 6
